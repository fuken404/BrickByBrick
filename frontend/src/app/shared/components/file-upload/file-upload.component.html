<div class="upload">
  <label class="drop-zone" [class.dragging]="dragging()"
         (dragover)="onDragOver($event)" (dragleave)="dragging.set(false)" (drop)="onDrop($event)">
    <mat-icon class="drop-icon">cloud_upload</mat-icon>
    <span class="drop-label">{{ etiqueta() }}</span>
    <span class="drop-hint">Máx. {{ maxSizeMb() }} MB{{ multiple() ? ' · hasta ' + maxFiles() + ' archivos' : '' }}</span>
    <input type="file" class="sr-only" [accept]="accept()" [multiple]="multiple()" (change)="onChange($event)" />
  </label>

  @if (error()) {
    <div class="form-error" role="alert"><mat-icon>error_outline</mat-icon>{{ error() }}</div>
  }

  @if (files().length) {
    <ul class="file-list">
      @for (f of files(); track f.id) {
        <li class="file-item">
          @if (f.preview) {
            <img [src]="f.preview" alt="" class="file-preview" />
          } @else {
            <div class="file-icon"><mat-icon>description</mat-icon></div>
          }
          <div class="file-info">
            <span class="file-name">{{ f.file.name }}</span>
            <span class="file-size">{{ formato(f.file.size) }}</span>
          </div>
          <button type="button" class="icon-btn danger" (click)="quitar(f.id)" [attr.aria-label]="'Quitar ' + f.file.name">
            <mat-icon>close</mat-icon>
          </button>
        </li>
      }
    </ul>
  }
</div>
