# =============================================================
# BrickByBrick — Docker Compose
#   docker compose up -d postgres          → solo la base de datos (desarrollo con npm run dev)
#   docker compose --profile app up --build → base de datos + aplicación completa en http://localhost:8080
#
# La aplicación usa la misma imagen "todo en uno" que se despliega en Railway
# (Dockerfile en la raíz del repositorio).
# =============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: brickbybrick_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brickbybrick
      POSTGRES_PASSWORD: brickbybrick_dev
      POSTGRES_DB: brickbybrick
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - brickbybrick_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brickbybrick"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: brickbybrick_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://brickbybrick:brickbybrick_dev@postgres:5432/brickbybrick
      FRONTEND_URL: http://localhost:${APP_PORT:-8080}
      PORT: 3000
    ports:
      - "${APP_PORT:-8080}:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [app]

volumes:
  brickbybrick_pgdata:
    name: brickbybrick_pgdata
  uploads:
    name: brickbybrick_uploads
